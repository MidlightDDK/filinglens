name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm -s typecheck
      - run: pnpm -s test
      - run: pnpm -s build
      # Secret values must never ship to browsers: Groq (gsk_), Google (AIza),
      # and Turnstile secret keys (0x4…, ~35 chars; public site keys are ~22).
      - name: No secrets in the web bundle
        run: |
          if grep -rEl 'gsk_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|0x4[A-Za-z0-9_-]{28,}' web/dist; then
            echo "::error::secret-like value in web/dist"
            exit 1
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag; pin the full release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --project pipeline --locked
      - run: uv run --project pipeline ruff check -q
      - run: uv run --project pipeline ruff format --check -q
      - run: uv run --project pipeline pytest -q

  # Retrieval eval on the dev split for the default config, gated on
  # evals/baseline.json. The index is cached; a miss rebuilds it from cached
  # (or freshly downloaded) SEC filings, which needs the SEC_USER_AGENT secret.
  #
  # Then, only when the GROQ_API_KEY secret exists (forks get none), the answers
  # eval on 20 dev items, gated on numeric EM and citation coverage vs
  # evals/baseline_answers.json. The judge is skipped to save free-tier quota
  # (the gated metrics don't use it); LLM calls are cached across runs.
  retrieval-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_GROQ: ${{ secrets.GROQ_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: data/models
          key: models-${{ hashFiles('packages/core/src/models.ts', 'pipeline/pipeline/tokenizer.py') }}
      - id: index
        uses: actions/cache@v6
        with:
          # data/processed holds the texts that gold spans point into.
          path: |
            data/processed
            web/public/index/structure
          key: index-${{ hashFiles('pipeline/pipeline/**', 'pipeline/config/**', 'pipeline/uv.lock', 'scripts/src/build-index.ts', 'packages/core/src/**', 'pnpm-lock.yaml') }}
      - if: steps.index.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: data/raw
          key: sec-raw-${{ hashFiles('pipeline/config/corpus.yaml') }}
      - if: steps.index.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          # Content-addressed passage embeddings: a partial restore still helps.
          path: data/cache/embeddings
          key: embeddings-${{ hashFiles('packages/core/src/models.ts') }}-${{ hashFiles('pipeline/pipeline/**', 'pipeline/config/**') }}
          restore-keys: embeddings-${{ hashFiles('packages/core/src/models.ts') }}-
      - if: steps.index.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Build the index (cache miss)
        if: steps.index.outputs.cache-hit != 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Index cache miss and no SEC_USER_AGENT secret (forks get no secrets)."
            exit 1
          fi
          uv sync --project pipeline --locked
          pnpm -s data:ingest
          pnpm -s data:chunk > /dev/null
          pnpm -s index --strategy structure
      - name: Retrieval eval (gate)
        run: pnpm -s eval:retrieval --config default --split dev --gate
      - if: always() && env.HAS_GROQ == 'true'
        uses: actions/cache@v6
        with:
          path: evals/.cache/llm
          key: llm-${{ github.run_id }}
          restore-keys: llm-
      - name: Answers eval (gate)
        if: always() && env.HAS_GROQ == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          code=0
          node evals/src/answers.ts --split dev --limit 20 --skip-judge --gate || code=$?
          if [ "$code" = 3 ]; then
            echo "::warning::Groq free-tier quota exhausted; answers eval skipped"
            exit 0
          fi
          exit "$code"
      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat evals/results/*/summary.md evals/results/*/answers.md > comment.md 2>/dev/null || true
          if [ -s comment.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md --edit-last --create-if-none
          fi
