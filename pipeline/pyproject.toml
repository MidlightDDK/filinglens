[project]
name = "filinglens-pipeline"
version = "0.0.0"
description = "Offline SEC 10-K ingest, parse, and chunk pipeline for FilingLens."
requires-python = ">=3.12,<3.13"
dependencies = [
    "lxml>=6.1.3",
    "pyyaml>=6.0.3",
    "tokenizers==0.23.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pipeline"
module-root = ""

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
